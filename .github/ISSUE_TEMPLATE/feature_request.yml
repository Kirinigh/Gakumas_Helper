name: Gakumas Helper 功能建议
description: 为派生功能提出可验证的新能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [与上游的区别](https://github.com/Kirinigh/Gakumas_Helper/blob/main/guides/UPSTREAM_DIFFERENCES.md)，并确认建议属于本派生项目。上游原功能建议请提交到 MaaGakumasu。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，未找到同一建议
          required: true
        - label: 该建议属于 Gakumas Helper 新增能力，而不是上游 MaaGakumasu 的通用需求
          required: true
        - label: 内容不含个人信息、凭据、私人截图/样本或未经许可的第三方资源
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的实际问题
      description: 描述当前工作流为什么不足，不要只写期望按钮名
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户入口、默认行为、失败处理和是否可能消耗游戏资源
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 精度、节拍与安全影响
      description: 对竞技场建议请说明如何避免低可信结果、胜率虚高或额外交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: input
    id: version
    attributes:
      label: 当前使用版本
    validations:
      required: true
