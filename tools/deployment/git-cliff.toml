# This configuration belongs to the derived release process, not upstream CI.
[changelog]
header = ""
body = """
## {{ version }} 更新记录
{% for group, items in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in items %}
- {% if commit.scope %}**{{ commit.scope }}**：{% endif %}{% if commit.breaking %}**不兼容变更：**{% endif %}{{ commit.message }}（[{{ commit.id | truncate(length=7, end="") }}](https://github.com/Kirinigh/Gakumas_Helper/commit/{{ commit.id }})，{{ commit.author.name }}）
{% if commit.body %}
{{ commit.body | indent(prefix="  ") }}
{% endif %}
{% if commit.breaking_description %}
  不兼容变更说明：{{ commit.breaking_description }}
{% endif %}
{% endfor %}
{% endfor %}
### 贡献者

以下名单按本次公开提交的作者记录去重：
{% for name in commits | map(attribute="author.name") | unique | sort %}
- {{ name }}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
    { footer = "^Upstream-Sync: ?true$", group = "<!-- -1 -->🔄 上游同步" },
    { message = "^feat", group = "<!-- 0 -->✨ 新功能" },
    { message = "^fix", group = "<!-- 1 -->🐛 问题修复" },
    { message = "^perf", group = "<!-- 2 -->🚀 性能优化" },
    { message = "^refactor", group = "<!-- 3 -->♻️ 代码重构" },
    { message = "^docs", group = "<!-- 4 -->📚 文档" },
    { message = "^test", group = "<!-- 5 -->🧪 测试" },
    { message = "^style", group = "<!-- 6 -->🎨 样式" },
    { message = "^ci", group = "<!-- 7 -->⚙️ 构建与发布" },
    { message = "^chore", group = "<!-- 8 -->🔧 日常维护" },
    { message = "^revert", group = "<!-- 9 -->↩️ 撤销" },
    { message = ".*", group = "<!-- 10 -->其他变化" },
]
